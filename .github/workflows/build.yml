name: "Build"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the release job takes write for the upload.
permissions:
  contents: read

# One build per ref at a time: a second push to the same branch or tag
# waits for the first, so two release uploads cannot cross.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same runner used locally. The checks that need the discs or an
  # installed game, which are not in the repository, skip themselves.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # nasm builds the asm blobs the tables are checked against and the
      # devices check reads its listing; Unicorn runs the stubs; Pillow and
      # the URW fonts the labels check; xvfb gives tools/guitest.py a
      # display. A check whose tool is
      # missing skips itself and says so, and check.py counts a skip as a
      # pass, so a package left out here is a green run that tested less.
      - run: sudo apt-get update && sudo apt-get install -y nasm xvfb fonts-urw-base35 && pip install pyflakes unicorn pillow
      - run: xvfb-run -a -s "-screen 0 1600x1400x24" python3 tools/check.py --colour always

      # Separately, prove the C still builds and still exports what the
      # game imports. net/build.py --check, part of the run above, is what
      # compares net/MGNetWk.dll against these sources; this says the
      # sources are still a DLL the game can load.
      - name: Netplay DLL compiles
        run: |
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
          python3 net/build.py --out /tmp --dry     # the same flags as a release build, nothing written to the repo
          for sym in DllGetClassObject DllCanUnloadNow DllRegisterServer \
                     DllUnregisterServer _CreateGameNetwork@4; do
            i686-w64-mingw32-objdump -p /tmp/MGNetWk.dll | grep -qF "$sym" \
              || { echo "missing export: $sym"; exit 1; }
          done
          i686-w64-mingw32-objdump -p /tmp/MGNetWk.dll | grep -i 'DLL Name'
          echo "ok"

  # Builds on every push to a branch above, on a tag, and on demand from
  # the Actions tab. Pull requests are left out: the push that follows the
  # merge builds the same tree, and PyInstaller takes minutes.
  #
  # A push build is an unsigned artifact and nothing else. Artifacts keep
  # for 90 days, so the last few commits are always downloadable without
  # tagging anything. A tag build hands its unzipped build to the sign job,
  # and only the release job after it reaches the release page.
  windows:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyInstaller from source, with its bootloader built here rather than
      # taken from the wheel. The wheel's bootloader is the same bytes in
      # every PyInstaller exe ever shipped, malware included, so antivirus
      # signatures match it; one built on this runner matches nothing.
      # Needs the MSVC toolchain, which windows-latest carries. certifi is
      # not imported unless the platform trust store fails, but it has to be
      # installed here or there is nothing to fall back to in the exe; the
      # bundle check below is what notices if it goes missing.
      - name: PyInstaller with a fresh bootloader
        shell: bash
        run: |
          git clone -q --depth 1 --branch v6.21.0 https://github.com/pyinstaller/pyinstaller.git pyi
          cd pyi && test "$(git rev-parse HEAD)" = 1cda34561015a90b6e1ae31dc89703799adaf13e   # v6.21.0, the tag pinned to its commit
          cd bootloader && python ./waf all
          cd .. && pip install -q .
          cd .. && pip install -q certifi
          python -c "import PyInstaller; print(PyInstaller.__version__)"

      # The source carries no version. A tag build takes it from the tag, so
      # the tag and the filename cannot disagree; anything else takes the
      # short SHA, so a downloaded artifact says which commit built it.
      # Everything downstream - the spec, the exe name, the Windows file
      # properties, the window title, --version - reads this one line.
      - name: Stamp the version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          python - "$version" <<'EOF'
          import pathlib, re, sys
          src = pathlib.Path('sr2-patcher.py')
          text, n = re.subn(r"^VERSION = '.*'$", "VERSION = '%s'" % sys.argv[1],
                            src.read_text(encoding='utf-8'), count=1, flags=re.M)
          if n != 1:
              raise SystemExit('no VERSION line in sr2-patcher.py')
          src.write_text(text, encoding='utf-8', newline='\n')
          EOF
          grep '^VERSION = ' sr2-patcher.py

      # Everything about the build lives in sr2-patcher.spec, including the
      # version, which it reads out of the script.
      - run: pyinstaller sr2-patcher.spec --noconfirm

      # A frozen build fails at import time or not at all, so check the
      # bundle: no tkinter and the exe is dead on arrival.
      - name: Inspect the bundle
        shell: bash
        run: |
          ls -l dist/ dist/sr2-patcher/
          pyi-archive_viewer -l -b dist/sr2-patcher/*.exe > listing.txt
          grep -q 'pyi_rth__tkinter' listing.txt || { echo 'no Tk runtime hook'; exit 1; }
          ls dist/sr2-patcher/_internal/_tkinter*.pyd || { echo 'tkinter was not bundled'; exit 1; }
          ls dist/sr2-patcher/_internal/certifi/cacert.pem || { echo 'certifi CA list was not bundled'; exit 1; }
          ls dist/sr2-patcher/_internal/MGNetWk.dll || { echo 'netplay DLL was not bundled'; exit 1; }
          echo "$(find dist/sr2-patcher -type f | wc -l) files, tkinter, CA list and DLL present"

      # The listing cannot see inside the PYZ, so an over-eager entry in
      # EXCLUDES looks fine there and dies at the exe's own import line.
      # Running it is the only test that catches that. --selfcheck needs
      # neither a display nor a copy of the game.
      #
      # The exe is windowed: on a crash it puts up a dialog and waits for
      # someone to click it, so the timeout is what makes that a failed step
      # instead of a hung job.
      - name: The exe starts
        shell: bash
        run: |
          timeout 60 dist/sr2-patcher/sr2-patcher-*.exe --selfcheck
          echo 'the exe runs and its tables check out'

      # To the log, not an asset: a checksum beside its own binary proves
      # nothing. The VirusTotal line is a lookup, not an upload: it says
      # whether anyone has already scanned this exact file, and where.
      # On a tag this is the unsigned exe; the sign job prints the one that
      # ships.
      - name: Checksum
        shell: bash
        run: |
          cd dist/sr2-patcher && sha256sum *.exe
          echo "VirusTotal: https://www.virustotal.com/gui/file/$(sha256sum *.exe | cut -c1-64)"

      # Linux users run the script, so ship it too. Strip CR or the shebang
      # breaks when it is run directly.
      - name: Stage the script
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, re, shutil
          src = pathlib.Path('sr2-patcher.py')
          text = src.read_bytes().replace(b'\r\n', b'\n')
          version = re.search(rb"^VERSION = '(.*)'$", text, re.M).group(1).decode()
          pathlib.Path('dist/sr2-patcher-%s.py' % version).write_bytes(text)
          shutil.copy('net/MGNetWk.dll', 'dist/MGNetWk.dll')
          print('staged sr2-patcher-%s.py and MGNetWk.dll' % version)
          EOF
          if grep -q $'\r' dist/sr2-patcher-*.py; then
            echo 'a CR survived - ./sr2-patcher.py would not run on Linux'
            exit 1
          fi
          ls -l dist/

      # Tagged builds carry the tag, everything else the short SHA, so a
      # folder of downloads says which commit each one came from.
      - name: Name the artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "artifact=sr2-patcher-$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "artifact=sr2-patcher-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # Two zips: -win with the exe and _internal/ at its top, -python with
      # the script and the netplay DLL beside it (tools/package.py). Not
      # -src: GitHub adds its own "Source code" zip to every release, and
      # two of those confuse.
      - name: Zip
        if: github.ref_type != 'tag'
        shell: bash
        run: python tools/package.py dist "$artifact"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: ${{ env.artifact }}
          path: dist/*.zip

      # A trial of the release without PyInstaller, built beside it on
      # pushes (not tags) as an artifact of its own, to compare the two on
      # VirusTotal: the runner's official Python unpacked into _internal
      # with the script (tools/bundle.py), and a small launcher beside it
      # (launcher/). continue-on-error: a failure here costs the trial,
      # never the build above.
      - name: Unpacked build (trial)
        if: github.ref_type != 'tag'
        continue-on-error: true
        shell: bash
        run: |
          python tools/bundle.py unpacked
          version=$(sed -n "s/^VERSION = '\(.*\)'$/\1/p" sr2-patcher.py)
          echo "version=$version" >> "$GITHUB_ENV"
          python - "$version" <<'EOF'
          import sys
          v = sys.argv[1]
          parts = v.split('.')
          nums = [int(p) for p in parts] if len(parts) <= 4 and all(p.isdigit() for p in parts) else []
          nums = (nums + [0] * 4)[:4]
          with open('launcher/version.h', 'w') as fh:
              fh.write('#define VER_PARTS %s\n#define VER_STRING "%s"\n#define VER_FILENAME "sr2-patcher-%s.exe"\n'
                       % (','.join(map(str, nums)), v, v))
          EOF

      - name: Launcher (trial)
        if: github.ref_type != 'tag'
        continue-on-error: true
        shell: cmd
        run: call launcher\build.bat "%GITHUB_WORKSPACE%\unpacked\sr2-patcher-%version%.exe"

      # The launcher finds the script and passes the arguments through, the
      # bundled Python imports what the window and the download need, and
      # the Python files are the PSF-signed ones.
      - name: The unpacked build starts (trial)
        if: github.ref_type != 'tag'
        continue-on-error: true
        shell: bash
        run: |
          cd unpacked
          timeout 60 ./sr2-patcher-*.exe --selfcheck
          echo 'the launcher runs the script and its tables check out'
          timeout 60 _internal/python.exe -c "import sys, tkinter, ssl, certifi, ctypes, urllib.request; r = tkinter.Tk(); r.destroy(); print('Tk', tkinter.TkVersion, '|', ssl.OPENSSL_VERSION); print(sys.path)"
          powershell -NoProfile -Command "Get-AuthenticodeSignature _internal\python*.dll, _internal\pythonw.exe, _internal\DLLs\_tkinter.pyd | Format-Table Status, @{n='Signer';e={\$_.SignerCertificate.Subject}}, Path -AutoSize -Wrap"
          sha256sum sr2-patcher-*.exe
          python -c "
          import os, zipfile
          with zipfile.ZipFile('../$artifact-unpacked-win.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _d, files in os.walk('.'):
                  for f in sorted(files):
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, '.'))
          "
          ls -l "../$artifact-unpacked-win.zip"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        continue-on-error: true
        with:
          name: ${{ env.artifact }}-unpacked
          path: ${{ env.artifact }}-unpacked-win.zip

      # A tag's build goes to the sign job unzipped: the exe is signed
      # before anything is packed.
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: unsigned
          path: dist/
          retention-days: 1

  # Signs the tag's exe with the Certum cloud certificate through ssign, on
  # Linux, and zips the result. The credentials are secrets of the
  # `signing` environment, which only v* tags can use (Settings ->
  # Environments -> signing -> Deployment branches and tags); no other job
  # and no other ref can read them. With a required reviewer set there, the
  # job waits for approval on the run's page before it starts.
  #
  # CERTUM_EMAIL is the SimplySign account's e-mail; CERTUM_OTP is the whole
  # otpauth:// URI from the SimplySign QR code, not the bare seed, so the
  # TOTP algorithm is read from it rather than assumed. The URI signs as its
  # owner for as long as it is valid: if it leaks, re-issue the QR code.
  sign:
    needs: windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: dist

      # Built from a pinned commit with its own lockfile, not the latest
      # crate: this binary is handed the signing credentials.
      - name: ssign, pinned
        run: |
          cargo install --locked --git https://github.com/Le-Syl21/ssign \
            --rev 2cc2b1a6f5b5abe4695b184cb806621b3b355ad2 ssign
          ssign --version

      - name: Sign
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          ssign -n "SR2 Patcher" -u "https://github.com/$GITHUB_REPOSITORY" \
            dist/sr2-patcher/sr2-patcher-*.exe

      # ssign does not verify its own output. A signature whose digest does
      # not match, or one without a timestamp - invalid once the certificate
      # expires - fails the job here instead of reaching the release.
      - name: Verify
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          out=$(osslsigncode verify -in dist/sr2-patcher/sr2-patcher-*.exe 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q MISMATCH; then echo '::error::the Authenticode digest does not match'; exit 1; fi
          if echo "$out" | grep -q 'Timestamp is not available'; then echo '::error::the signature has no timestamp'; exit 1; fi
          echo "$out" | grep -q 'Signature verification: ok' || { echo '::error::the signature did not verify'; exit 1; }

      - name: Checksum
        run: |
          cd dist/sr2-patcher && sha256sum *.exe
          echo "VirusTotal: https://www.virustotal.com/gui/file/$(sha256sum *.exe | cut -c1-64)"

      - name: Zip
        run: python3 tools/package.py dist "sr2-patcher-$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: sr2-patcher-${{ github.ref_name }}
          path: dist/*.zip

  # The only job with write access, and it holds no signing secrets.
  release:
    needs: sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sr2-patcher-${{ github.ref_name }}
          path: dist

      # gh is preinstalled on the runner, so no third party action is needed
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
